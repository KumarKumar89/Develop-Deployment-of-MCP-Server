[package]
name = "cybersecurity-mcp-server"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "A security-first Rust MCP server starter for defensive cybersecurity workflows"
license = "MIT"
repository = "https://github.com/KumarKumar89/Develop-Deployment-of-MCP-Server"
readme = "README.md"
keywords = ["mcp", "security", "cybersecurity", "model-context-protocol"]
categories = ["network-programming", "command-line-utilities"]

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["http1", "tokio"] }
hex = "0.4"
rmcp = { version = "3.5.1", default-features = false, features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "signal", "net"] }
tower-http = { version = "0.7", features = ["limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"

[dev-dependencies]
serde_json = "1.0"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
