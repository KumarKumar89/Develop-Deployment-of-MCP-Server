services:
  mcp:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      MCP_TRANSPORT: http
      MCP_BIND: 0.0.0.0:8080
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:?Set MCP_BEARER_TOKEN in the root .env file}
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    restart: unless-stopped

  caddy:
    image: caddy:2
    environment:
      MCP_DOMAIN: ${MCP_DOMAIN:?Set MCP_DOMAIN in the root .env file}
    depends_on:
      - mcp
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
