name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Format, lint, test, and audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"

      - name: Ensure Cargo.lock exists
        id: lock
        run: |
          if [ ! -f Cargo.lock ]; then
            cargo generate-lockfile
            echo "generated=true" >> "$GITHUB_OUTPUT"
          else
            echo "generated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply rustfmt
        run: cargo fmt --all

      - name: Commit Cargo.lock and fmt fixes on main
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: sync Cargo.lock and rustfmt"
            git push
          fi

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Unit and integration tests
        run: cargo test --all-targets

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        run: cargo audit

  docker:
    name: Build container image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Cargo.lock for Docker build
        run: |
          if [ ! -f Cargo.lock ]; then
            cargo generate-lockfile || true
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: cybersecurity-mcp-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
